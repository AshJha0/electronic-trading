version: 2
updates:
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /docs/site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major versions change the seeded random streams (API_SPEC Section 4)
      # and with them every simulation result; upgrade deliberately, with a
      # golden regeneration, never automatically.
      - dependency-name: "rand"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_chacha"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_distr"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Newer criterion needs a Rust newer than the crate's MSRV (1.78).
      - dependency-name: "criterion"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The tag is the Rust version the MSRV job tests, not an action version.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]

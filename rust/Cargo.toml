[package]
name = "etrade"
version = "1.1.0"
edition = "2021"
rust-version = "1.78"
description = "Execution and market-making research: Almgren-Chriss optimal execution, Avellaneda-Stoikov market making, execution analytics"
license = "MIT"
repository = "https://github.com/AshJha0/electronic-trading"
homepage = "https://ashjha0.github.io/electronic-trading/"
readme = "../README.md"
keywords = ["trading", "execution", "market-making", "quant", "finance"]
categories = ["finance", "mathematics", "simulation"]

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.6"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }

# Hot-path benchmarks: `cargo bench --bench hot_paths`. Not run by CI.
[[bench]]
name = "hot_paths"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
